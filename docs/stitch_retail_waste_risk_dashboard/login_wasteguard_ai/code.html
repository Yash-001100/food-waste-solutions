<body class="bg-background text-on-background min-h-screen flex items-center justify-center font-body-base p-margin_mobile md:p-margin_desktop">
<!-- Main Container -->
<main class="w-full max-w-md bg-surface-container-lowest border border-outline-variant rounded-xl shadow-[0_4px_12px_rgba(4,22,39,0.04)] overflow-hidden">
<!-- Header Section -->
<header class="p-gutter border-b border-outline-variant bg-surface-bright flex flex-col items-center">
<div class="w-16 h-16 bg-primary-container text-on-primary-fixed rounded-full flex items-center justify-center mb-stack_gap_md shadow-[0_2px_8px_rgba(4,22,39,0.08)]">
<span class="material-symbols-outlined text-4xl" data-icon="recycling" style="font-variation-settings: 'FILL' 1;">recycling</span>
</div>
<h1 class="font-display-lg text-display-lg text-primary text-center">WasteGuard AI</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-stack_gap_sm text-center">Store Co-Pilot &amp; Risk Management</p>
</header>
<!-- Form Section -->
<section class="p-gutter">
<form action="#" class="flex flex-col gap-stack_gap_lg" method="POST">
<!-- Demo Instructions Card -->
<div class="bg-surface-container-low border border-outline-variant rounded-lg p-stack_gap_md flex items-start gap-stack_gap_sm">
<span class="material-symbols-outlined text-outline mt-1" data-icon="info">info</span>
<div>
<h3 class="font-data-mono text-data-mono text-on-surface">Demo Access</h3>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1">Any store code, password: <strong class="text-primary">foodwaste2026</strong></p>
</div>
</div>
<!-- Input Fields -->
<div class="flex flex-col gap-stack_gap_md">
<div>
<label class="block font-data-mono text-data-mono text-on-surface mb-2" for="store_code">Store Code</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-3">
<span class="material-symbols-outlined text-outline" data-icon="storefront">storefront</span>
</span>
<input class="w-full pl-10 pr-3 py-2 bg-surface-bright border border-outline-variant rounded-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-shadow font-body-base text-body-base" id="store_code" name="store_code" placeholder="Enter store code" required="" type="text"/>
</div>
</div>
<div>
<label class="block font-data-mono text-data-mono text-on-surface mb-2" for="password">Password</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-3">
<span class="material-symbols-outlined text-outline" data-icon="lock">lock</span>
</span>
<input class="w-full pl-10 pr-3 py-2 bg-surface-bright border border-outline-variant rounded-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-shadow font-body-base text-body-base" id="password" name="password" placeholder="Enter password" required="" type="password"/>
</div>
</div>
</div>
<!-- Actions -->
<div class="flex flex-col gap-stack_gap_md mt-stack_gap_sm">
<button class="w-full bg-primary text-on-primary py-3 rounded-lg font-data-mono text-data-mono hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
<span>Sign In</span>
<span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
<a class="text-center font-body-sm text-body-sm text-on-surface-variant hover:text-primary transition-colors underline decoration-outline-variant hover:decoration-primary underline-offset-2" href="#">
                        Need technical support?
                    </a>
</div>
</form>
</section>
<!-- Footer -->
<footer class="bg-surface-container-lowest p-stack_gap_md border-t border-outline-variant text-center">
<p class="font-label-caps text-label-caps text-outline uppercase tracking-wider">Secure Retail Environment • Ver 2.4.1</p>
</footer>
